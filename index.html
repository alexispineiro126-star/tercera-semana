<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panadería</title>
    <script defer src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <input type="search" id="busqueda" class="input" placeholder="Buscar productos..." aria-label="Buscar productos">
        <button id="modo-oscuro" class="btn btn-outline-light" type="button" aria-pressed="false">
            <i id="icono-modo" class="bi bi-moon-stars-fill me-2" aria-hidden="true"></i>
            <span id="texto-modo"></span>
        </button>
    </header>
        <section class="hero">
            <div class="hero-content">
                <h1 class="title">Bienvenido a nuestra Panadería</h1>
                <p class="description">Disfruta de nuestros productos frescos y deliciosos.</p>
            </div>
        <div class="hero-image-container">
            <img src="./assets/portada.jpg" alt="portada de la panadería" class="hero-image">
        </div>
    </section>
    <div id="alerta" class="alerta" role="status" aria-live="polite"></div>
    <section class="section">
        <button id="ver-carrito" class="abrir" type="button" aria-label="Abrir carrito" aria-controls="panel-carrito" aria-expanded="false"><i class="bi bi-cart-fill"></i></button>
        <div class="carrito" id="panel-carrito" aria-hidden="true">
            <button class="cerrar" type="button" aria-label="Cerrar carrito">X</button>
            <div class="carrito-contenido">
                <h3 class="h3"><i class="bi bi-cart-fill"></i>Carrito</h3>
                <ul id="lista"></ul>
            </div>
            <div class="carrito-acciones">
                <p class="total" id="total">Total: $0</p>
                <div class="carrito-botones">
                    <button class="comprar" id="compra">comprar</button>
                    <button class="vaciar" id="vaciar">Vaciar carrito</button>
                </div>
            </div>
        </div>
    </section>
    <main class="main" id="productos" aria-live="polite"></main>
    <footer class="footer">
        <p>© 2024 Panadería. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
